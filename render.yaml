# Render Blueprint: oyunun tamamı (sayfa + oda sunucusu) tek bir web servisinde çalışır.
# Render panelinde New → Blueprint → bu depoyu seç → Apply.
services:
  - type: web
    name: magnet-buddies
    runtime: node
    # Türkiye'ye en yakın bölge: tuş gecikmesi Oregon'a göre çok daha düşük.
    # Render bölgeyi sonradan değiştirmeye izin vermez; değiştirmek için servis silinip Blueprint yeniden uygulanır.
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
